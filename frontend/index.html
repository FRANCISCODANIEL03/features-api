<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Análisis de Fraude</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; padding: 2rem; }
        main { max-width: 900px; margin: 0 auto; display: grid; gap: 2rem; }
        section { background-color: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; border-bottom: 1px solid #333; padding-bottom: 1rem; color: #fff; }
        
        label { display: block; margin-bottom: 0.5rem; color: #bbb; font-weight: 600; }
        select, input { width: 100%; padding: 0.8rem; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 1.5rem; font-size: 1rem; }
        
        button { width: 100%; padding: 1rem; background: #bb86fc; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #9a67ea; }
        button:disabled { background: #444; color: #888; }

    </style>
</head>
</html>
